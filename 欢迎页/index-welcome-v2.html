<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sakamichi Tools - 坂道系列综合工具平台，提供成员消息样式生成器、字幕生成器、博客翻译等专业工具服务">

  <meta property="og:description" content="提供成员消息样式生成器、字幕生成器、博客翻译等专业工具服务">

  <meta property="og:url" content="https://sakamichi-tools.cn/">
  <meta property="og:image" content="https://sakamichi-tools.cn/images/sakamichi.jpg">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Sakamichi Tools - 坂道系列综合工具平台">
  <meta name="twitter:description" content="提供成员消息样式生成器、字幕生成器、博客翻译等专业工具服务">
  <meta name="twitter:image" content="https://sakamichi-tools.cn/images/sakamichi.jpg">
  <link rel="canonical" href="https://sakamichi-tools.cn/">
  
  <title>Sakamichi Tools - 坂道工具集</title>
  
  <link rel="icon" type="image/jpeg" href="/images/sakamichi.jpg">
  <link rel="apple-touch-icon" href="/images/sakamichi.jpg">
  <meta name="theme-color" content="#742581">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Noto Sans SC', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
      background: linear-gradient(135deg, #742581 0%, #742581 20%, #F19DB5 40%, #F19DB5 60%, #7BC7E8 80%, #7BC7E8 100%);
      background-size: 400% 400%;
      animation: gradientShift 15s ease infinite;
      -webkit-animation: gradientShift 15s ease infinite;
    }

    @keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    @-webkit-keyframes gradientShift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }

    /* 装饰性动态背景 */
    .bg-decoration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: hidden;
      z-index: 0;
    }

    .bg-circle {
      position: absolute;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      animation: float 20s ease-in-out infinite;
    }

    .bg-circle:nth-child(1) {
      width: 300px;
      height: 300px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }

    .bg-circle:nth-child(2) {
      width: 200px;
      height: 200px;
      top: 60%;
      right: 15%;
      animation-delay: 2s;
    }

    .bg-circle:nth-child(3) {
      width: 150px;
      height: 150px;
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(180deg); }
    }

    /* 加载动画 */
    .loading-screen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #5a1d6b 0%, #742581 50%, #8e3a9e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      opacity: 1;
      transition: opacity 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .loading-screen.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .loading-rings {
      position: relative;
      width: 100px;
      height: 100px;
    }

    .ring {
      position: absolute;
      border: 3px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      animation: spin 1.5s cubic-bezier(0.5, 0, 0.5, 1) infinite;
    }

    .ring:nth-child(1) {
      width: 100px;
      height: 100px;
      top: 0;
      left: 0;
      animation-delay: 0s;
    }

    .ring:nth-child(2) {
      width: 80px;
      height: 80px;
      top: 10px;
      left: 10px;
      border-top-color: rgba(255, 255, 255, 0.6);
      animation-delay: 0.1s;
    }

    .ring:nth-child(3) {
      width: 60px;
      height: 60px;
      top: 20px;
      left: 20px;
      border-top-color: rgba(255, 255, 255, 0.4);
      animation-delay: 0.2s;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    .loading-label {
      margin-top: 36px;
      font-size: 15px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.95);
      letter-spacing: 2px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }

    /* 主容器 */
    .app-container {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      opacity: 0;
      transition: opacity 1s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .app-container.visible {
      opacity: 1;
    }

    /* 头部 */
    .header-area {
      text-align: center;
      padding: 100px 20px 80px;
    }

    .brand-title {
      font-size: 56px;
      font-weight: 700;
      color: white;
      margin-bottom: 16px;
      letter-spacing: -1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      animation: slideInDown 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .brand-tagline {
      font-size: 18px;
      color: rgba(255, 255, 255, 0.95);
      font-weight: 400;
      letter-spacing: 1px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      animation: slideInUp 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes slideInDown {
      from {
        opacity: 0;
        transform: translateY(-40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slideInUp {
      from {
        opacity: 0;
        transform: translateY(40px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 卡片区域 */
    .cards-section {
      flex: 1;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px 100px;
      width: 100%;
    }

    .cards-wrapper {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
      gap: 32px;
    }

    .feature-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 56px 40px;
      text-align: center;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      animation: fadeInScale 0.6s cubic-bezier(0.4, 0, 0.2, 1) both;
    }

    .feature-card:nth-child(1) { animation-delay: 0.1s; }
    .feature-card:nth-child(2) { animation-delay: 0.2s; }
    .feature-card:nth-child(3) { animation-delay: 0.3s; }

    @keyframes fadeInScale {
      from {
        opacity: 0;
        transform: scale(0.9);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .feature-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, transparent 100%);
      opacity: 0;
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .feature-card:hover::before {
      opacity: 1;
    }

    .feature-card:hover {
      transform: translateY(-12px) scale(1.02);
      background: rgba(255, 255, 255, 0.25);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }

    .card-icon-box {
      width: 96px;
      height: 96px;
      margin: 0 auto 28px;
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      border: 2px solid rgba(255, 255, 255, 0.3);
    }

    .feature-card:hover .card-icon-box {
      transform: scale(1.15) rotate(10deg);
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.5);
    }

    .card-icon {
      width: 44px;
      height: 44px;
      stroke: white;
      stroke-width: 2;
      fill: none;
      filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.2));
    }

    .card-title {
      font-size: 28px;
      font-weight: 600;
      color: white;
      margin-bottom: 16px;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
    }

    .card-desc {
      font-size: 15px;
      color: rgba(255, 255, 255, 0.9);
      line-height: 1.7;
      margin-bottom: 32px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.1);
    }

    .card-action {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 14px 36px;
      background: white;
      color: #1f2937;
      text-decoration: none;
      font-size: 15px;
      font-weight: 600;
      border-radius: 50px;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
    }

    .card-action:hover {
      transform: scale(1.08);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
    }

    .card-action svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2.5;
      fill: none;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .card-action:hover svg {
      transform: translateX(4px);
    }

    /* 底部 */
    .footer-area {
      text-align: center;
      padding: 40px 20px;
      color: rgba(255, 255, 255, 0.85);
    }

    .footer-info {
      font-size: 14px;
      font-weight: 400;
      letter-spacing: 0.5px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.2);
    }

    /* 响应式 */
    @media (max-width: 1200px) {
      .cards-wrapper {
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      }
    }

    @media (max-width: 768px) {
      body {
        background-size: 300% 300%;
        animation: gradientShift 15s ease infinite;
        -webkit-animation: gradientShift 15s ease infinite;
      }

      .header-area {
        padding: 80px 20px 60px;
      }

      .brand-title {
        font-size: 40px;
      }

      .brand-tagline {
        font-size: 15px;
      }

      .cards-wrapper {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .feature-card {
        padding: 44px 32px;
      }

      .card-title {
        font-size: 24px;
      }

      .card-desc {
        font-size: 14px;
      }

      .bg-circle {
        display: none;
      }
    }
  </style>
</head>
<body>
  <!-- 背景装饰 -->
  <div class="bg-decoration">
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
    <div class="bg-circle"></div>
  </div>

  <!-- 加载动画 -->
  <div class="loading-screen" id="loadingScreen">
    <div class="loading-rings">
      <div class="ring"></div>
      <div class="ring"></div>
      <div class="ring"></div>
    </div>
    <div class="loading-label">LOADING</div>
  </div>

  <!-- 主应用 -->
  <div class="app-container" id="appContainer">
    <!-- 头部 -->
    <header class="header-area">
      <h1 class="brand-title">Sakamichi Tools</h1>
      <p class="brand-tagline">坂道系列综合工具平台</p>
    </header>

    <!-- 功能卡片 -->
    <section class="cards-section">
      <div class="cards-wrapper">
        <!-- 博客翻译 -->
        <div class="feature-card" onclick="goToService('https://blog.sakamichi-tools.cn/')">
          <div class="card-icon-box">
            <svg class="card-icon" viewBox="0 0 24 24">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
              <path d="M8 7h8M8 11h8M8 15h4"/>
            </svg>
          </div>
          <h2 class="card-title">博客翻译</h2>
          <p class="card-desc">坂道成员博客中日翻译<br>实时更新成员最新动态</p>
          <a href="https://blog.sakamichi-tools.cn/" class="card-action" onclick="event.stopPropagation()">
            <span>立即使用</span>
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>

        <!-- 生写生成器 -->
        <div class="feature-card" onclick="goToService('https://photocard.sakamichi-tools.cn')">
          <div class="card-icon-box">
            <svg class="card-icon" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="10"/>
              <path d="M12 6v6l4 2"/>
            </svg>
          </div>
          <h2 class="card-title">生写生成器</h2>
          <p class="card-desc">生写生成器与字幕实用工具<br>视频字幕处理及多功能生成器</p>
          <a href="https://photocard.sakamichi-tools.cn" class="card-action" onclick="event.stopPropagation()">
            <span>立即使用</span>
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>

        <!-- MSG样式生成器 -->
        <div class="feature-card" onclick="goToService('https://msg.sakamichi-tools.cn/')">
          <div class="card-icon-box">
            <svg class="card-icon" viewBox="0 0 24 24">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              <path d="M9 10h6M9 14h4"/>
            </svg>
          </div>
          <h2 class="card-title">MSG样式生成器</h2>
          <p class="card-desc">成员消息样式生成器<br>一键生成官方消息格式图片</p>
          <a href="https://msg.sakamichi-tools.cn/" class="card-action" onclick="event.stopPropagation()">
            <span>立即使用</span>
            <svg viewBox="0 0 24 24">
              <path d="M5 12h14M12 5l7 7-7 7"/>
            </svg>
          </a>
        </div>
      </div>
    </section>

    <!-- 底部 -->
    <footer class="footer-area">
      <p class="footer-info">Sakamichi Tools - 为坂道粉丝提供专业工具服务</p>
    </footer>
  </div>

  <script>
    // 页面加载处理
    window.addEventListener('load', function() {
      setTimeout(function() {
        // 隐藏加载屏幕
        const loadingScreen = document.getElementById('loadingScreen');
        loadingScreen.classList.add('hidden');
        
        // 显示主应用
        const appContainer = document.getElementById('appContainer');
        appContainer.classList.add('visible');
        
        // 移除加载屏幕
        setTimeout(function() {
          loadingScreen.remove();
        }, 800);
      }, 1500);
    });

    // 导航函数
    function goToService(url) {
      const card = event.currentTarget;
      card.style.transform = 'scale(0.95)';
      
      setTimeout(function() {
        window.location.href = url;
      }, 200);
    }

    // 阻止链接事件冒泡
    document.querySelectorAll('.card-action').forEach(link => {
      link.addEventListener('click', function(e) {
        e.stopPropagation();
      });
    });

    // 键盘快捷键
    document.addEventListener('keydown', function(e) {
      const serviceMap = {
        '1': 'https://msg.sakamichi-tools.cn/',
        '2': 'https://photocard.sakamichi-tools.cn',
        '3': 'https://blog.sakamichi-tools.cn/'
      };
      
      if (serviceMap[e.key]) {
        window.location.href = serviceMap[e.key];
      }
    });

    // 鼠标移动视差效果
    document.addEventListener('mousemove', function(e) {
      const cards = document.querySelectorAll('.feature-card');
      const mouseX = e.clientX / window.innerWidth - 0.5;
      const mouseY = e.clientY / window.innerHeight - 0.5;
      
      cards.forEach((card, index) => {
        const depth = (index + 1) * 10;
        const moveX = mouseX * depth;
        const moveY = mouseY * depth;
        
        if (!card.matches(':hover')) {
          card.style.transform = `translateX(${moveX}px) translateY(${moveY}px)`;
        }
      });
    });
  </script>
</body>
</html>
