name: Update Member Images

on:
  schedule:
    # 每周一凌晨2点（UTC时间，北京时间10点）运行
    - cron: '0 2 * * 1'
  
  # 也可以手动触发
  workflow_dispatch:

jobs:
  update-images:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: Checkout frontend repo
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install Playwright and dependencies
        run: |
          npm install playwright
          npx playwright install chromium --with-deps
          echo "Playwright ready"
      
      - name: Fetch member images
        run: |
          node scripts/fetch-member-images.js
          echo "Image fetch completed"
      
      - name: Check for changes
        id: check_changes
        run: |
          if [ -f "data/member-images.json" ]; then
            git add data/member-images.json
            if git diff --staged --quiet; then
              echo "has_changes=false" >> $GITHUB_OUTPUT
              echo "No changes detected"
            else
              echo "has_changes=true" >> $GITHUB_OUTPUT
              echo "Changes detected"
            fi
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "File not found: data/member-images.json"
          fi
      
      - name: Commit and push changes
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git commit -m "🤖 自动更新成员图片数据 [skip ci]"
          git push
      
      - name: No changes to commit
        if: steps.check_changes.outputs.has_changes == 'false'
        run: echo "✅ 成员图片数据已是最新，无需更新"
